services:
  db:
    image: postgres:18
    container_name: url-shortener-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    
  redis:
    image: redis:8
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      
  api:
    build: .
    environment:
      APP_ENV: ${APP_ENV:-development}
      # Container-internal values are fixed here rather than read from .env:
      # .env holds the localhost variants used when running outside compose,
      # and inheriting those would point the api at itself.
      HTTP_PORT: "8080"
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      REDIS_DB: ${REDIS_DB:-0}
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      CODE_LENGTH: ${CODE_LENGTH:-7}
      CACHE_TTL: ${CACHE_TTL:-1h}
      READ_TIMEOUT: ${READ_TIMEOUT:-5s}
      WRITE_TIMEOUT: ${WRITE_TIMEOUT:-10s}
      IDLE_TIMEOUT: ${IDLE_TIMEOUT:-120s}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
