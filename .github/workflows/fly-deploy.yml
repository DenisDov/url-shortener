# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy
on:
  push:
    branches:
      - main
      - master
jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy app
    needs: ci                    # no deploy unless lint, vet, tests and build pass
    runs-on: ubuntu-latest
    concurrency: deploy-group    # optional: ensure only one action runs at a time
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0         # git describe needs tags and history, not a shallow clone
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - id: version
        run: echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"
      # Stamped into the binary as main.version and served at /api/v1/version.
      - run: flyctl deploy --remote-only --build-arg VERSION=${{ steps.version.outputs.version }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
