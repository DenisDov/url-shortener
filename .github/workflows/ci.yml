# Lint, test and build. Runs on pull requests, and is called by fly-deploy.yml
# so a push to main cannot deploy without passing first.
#
# The steps deliberately call go directly rather than `make ci`: the Makefile
# includes .env (absent here) and derives BINARY_NAME from SERVICE_NAME.

name: CI
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Upstream recommends the binary install over go install / go tool;
      # this action does that, plus caching and inline PR annotations.
      # Keep `version` in sync with what developers install locally.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  test:
    name: Vet, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...
